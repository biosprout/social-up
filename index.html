<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2571F">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOCIAL UP!">
<title>SOCIAL UP! 中学社会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6F0;--panel:#FFFFFF;--panel2:#F6EDE3;
    --primary:#C2571F;--primary-dark:#9B4415;--accent:#C79212;
    --danger:#E03B50;--text:#241A12;--sub:#7D6A57;--border:#EADFD2;
    --shadow:0 8px 28px rgba(194,87,31,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 0%,#F4E6D6 0%,#FBF6F0 55%);min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  .topbar{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#FBF6F0 70%,rgba(251,246,240,0))}
  .brand .logo{font-family:'Poppins';font-weight:800;font-size:23px;letter-spacing:-.5px;color:var(--primary)}
  .brand .logo span{color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}

  .hsec{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .hsec h3{font-size:14px;font-weight:900;margin-bottom:8px;color:var(--accent)}
  .hsec p{font-size:12.5px;line-height:1.9;color:var(--text);font-weight:500;margin-bottom:8px}
  .hsec p:last-child{margin-bottom:0}
  .hlist{margin:6px 0 8px;padding-left:1.1em}
  .hlist li{font-size:12.5px;line-height:1.9;color:var(--sub);font-weight:500;margin-bottom:5px}
  .hlist li b{color:var(--text)}

  .helpbtn{background:var(--panel2);border:1px solid var(--border);border-radius:999px;
    width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--accent);cursor:pointer;margin-right:8px}
  .helpbtn:active{transform:scale(.94)}
  .topbar .right{display:flex;align-items:center}
  .rankpill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;color:var(--accent)}
  .screen{flex:1;overflow-y:auto;padding:6px 20px 40px;-webkit-overflow-scrolling:touch}
  .statcard{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:92px;height:92px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-family:'Poppins';font-size:23px;font-weight:800;color:var(--primary);line-height:1}
  .ring .in small{font-size:9px;color:var(--sub);font-weight:600;margin-top:2px}
  .stinfo h2{font-size:15px;font-weight:900;margin-bottom:8px}
  .stinfo .row{display:flex;gap:16px}
  .stinfo .row div{font-size:11px;color:var(--sub);font-weight:600}
  .stinfo .row b{display:block;font-family:'Poppins';font-size:19px;color:var(--text);font-weight:700}
  .daily{display:flex;align-items:center;gap:13px;border-radius:20px;padding:15px 17px;margin-bottom:16px;cursor:pointer;
    background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%);color:#FFFFFF;box-shadow:0 6px 20px rgba(0,0,0,.13);transition:.15s}
  .daily:active{transform:scale(.985)}
  .daily.done{background:linear-gradient(135deg,#12A98A 0%,#3BB273 100%);color:#FFFFFF}
  .daily .dic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .daily .dbd{flex:1;min-width:0}
  .daily .dbd h3{font-size:16px;font-weight:900;letter-spacing:.2px;line-height:1.3}
  .daily .dbd p{font-size:11px;font-weight:600;opacity:.88;margin-top:3px;line-height:1.45}
  .daily .dbar{height:5px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
  .daily .dbar i{display:block;height:100%;background:currentColor;border-radius:99px}
  .daily .dgo{font-size:12px;font-weight:800;background:rgba(255,255,255,.22);
    padding:8px 12px;border-radius:999px;flex:0 0 auto;white-space:nowrap}
  .label{font-size:12px;font-weight:800;color:var(--sub);margin:10px 2px 10px;letter-spacing:.3px}
  .lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
  .lvbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}
  .lvbtn:active{transform:scale(.97)}
  .lvbtn .n{font-size:13px;font-weight:900;display:block}
  .lvbtn .d{font-size:9px;color:var(--sub);font-weight:600;margin-top:3px;display:block}
  .lvbtn.on{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
  .lvbtn.on .d{color:rgba(8,32,26,.7)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:15px;padding:14px;cursor:pointer;transition:.15s;text-align:left}
  .fbtn:active{transform:scale(.98)}
  .fbtn .ic{font-size:20px}
  .fbtn .n{font-size:13px;font-weight:800;margin-top:5px}
  .fbtn .m{font-size:10px;color:var(--sub);font-weight:600;margin-top:3px}
  .fbtn .bar{height:4px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden}
  .fbtn .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
  .btn{border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer;transition:.15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#FFFFFF}
  .btn-ghost{background:var(--panel);color:var(--primary);border:1.5px solid var(--border)}
  .btn-accent{background:var(--accent);color:#6B4A00}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer;padding:6px 2px;margin-bottom:6px;font-family:inherit}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qhead .left{display:flex;align-items:center;gap:10px}
  .qhead h2{font-size:16px;font-weight:900}
  .timer{font-family:'Poppins';font-weight:800;font-size:20px;color:var(--accent)}
  .timer.warn{color:var(--danger)}
  .combo{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--accent)}
  .bar-top{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar-top i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tagf{font-size:10px;font-weight:800;color:var(--primary);letter-spacing:.4px}
  .taglv{font-size:9px;padding:3px 8px;border-radius:7px;font-weight:800}
  .taglv.easy{background:#F7E9D8;color:#C2571F}
  .taglv.std{background:#FFF6E2;color:var(--accent)}
  .taglv.hard{background:#FFE8EC;color:var(--danger)}
  .taglv.ibo{background:#F0E6FA;color:#7A3FC4}
  .lvbtn .n{font-size:12px}
  .qtext{font-size:17px;font-weight:700;line-height:1.55}
  .choices{display:grid;gap:9px}
  .choice{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--text);cursor:pointer;text-align:left;transition:.12s;line-height:1.45}
  .choice:active{transform:scale(.99)}
  .choice.correct{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
  .choice.wrong{background:var(--danger);border-color:var(--danger);color:#7A0012}
  .choice.dim{opacity:.4}
  .exp{border-radius:14px;padding:15px;margin-top:12px;font-size:13px;line-height:1.65;background:var(--panel2);border:1px solid var(--border)}
  .exp b{color:var(--primary)}
  .result{text-align:center;padding:26px 10px}
  .result .rank{font-family:'Poppins';font-size:62px;font-weight:800;line-height:1;color:var(--accent)}
  .result .emoji{font-size:48px;margin-bottom:4px}
  .result .big{font-family:'Poppins';font-size:44px;font-weight:800;color:var(--primary);line-height:1;margin-top:6px}
  .result h2{font-size:18px;font-weight:900;margin:10px 0 4px}
  .result p{color:var(--sub);font-weight:600;font-size:13px;margin-bottom:6px}
  .misslist{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:4px;margin:14px 0;max-height:260px;overflow-y:auto}
  .misslist .r{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
  .misslist .r:last-child{border:none}
  .misslist .r .q{font-weight:700;margin-bottom:4px}
  .misslist .r .a{color:var(--primary);font-weight:700;font-size:12px}
  .lvstat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lvstat:last-child{margin-bottom:0}
  .lvstat .ln{font-size:10px;font-weight:800;width:50px;flex:0 0 auto}
  .lvstat .ln.lv-easy{color:#C2571F}
  .lvstat .ln.lv-std{color:var(--accent)}
  .lvstat .ln.lv-hard{color:var(--danger)}
  .lvstat .ln.lv-ibo{color:#7A3FC4}
  .lvstat .lb{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
  .lvstat .lb i{display:block;height:100%;border-radius:99px}
  .lvstat .lb i.lv-easy{background:#C2571F}
  .lvstat .lb i.lv-std{background:var(--accent)}
  .lvstat .lb i.lv-hard{background:var(--danger)}
  .lvstat .lb i.lv-ibo{background:#7A3FC4}
  .lvstat .lnum{font-family:'Poppins';font-size:10px;font-weight:700;color:var(--sub);width:48px;text-align:right;flex:0 0 auto}
  .lvstat .lrate{font-family:'Poppins';font-size:10px;font-weight:800;width:34px;text-align:right;flex:0 0 auto}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .achb{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:9px 8px;opacity:.5}
  .achb.got{opacity:1;border-color:var(--accent);background:#FFF6E2}
  .achb .an{font-size:10px;font-weight:800;line-height:1.3}
  .achb .ad{font-size:8px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.3}
    .evr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:7px;opacity:.45}
  .evr.got{opacity:1}
  .evr.cur{border-color:var(--accent);background:#FFF6E2;box-shadow:0 0 0 1.5px var(--accent) inset}
  .evr .evn{font-family:'Poppins';font-size:11px;font-weight:800;color:var(--sub);width:20px;flex:0 0 auto;text-align:right}
  .evr .eve{font-size:22px;flex:0 0 auto}
  .evr .evb{flex:1;min-width:0}
  .evr .evt{font-size:13px;font-weight:800;line-height:1.35}
  .evr .evd{font-family:'Poppins';font-size:10px;color:var(--sub);font-weight:700;margin-top:2px}
  .evr.cur .evd{color:var(--accent)}
  .odr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .odr.ok{border-color:#2E9E6B;background:#EAF7F0}
  .odr.ok .odn{background:#2E9E6B;color:#FFFFFF}
  .odr.ng{border-color:var(--danger)}
  .odr .odn{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--panel2);color:var(--sub);font-family:Poppins;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .odr .odb{flex:1;min-width:0}
  .odr .odt{font-size:13.5px;font-weight:700;line-height:1.45}
  .odr .odd{font-size:11px;color:var(--sub);line-height:1.6;margin-top:4px}
  .odr .odd b{color:var(--accent)}
  .odr .odmark{font-size:20px;font-weight:900;flex:0 0 auto;line-height:1}
  .odr .odbtns{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
  .odr .odbtns button{width:34px;height:24px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:7px;font-size:11px;line-height:1;padding:0}
  .odr .odbtns button:disabled{opacity:.3}
  .zkr{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;opacity:.55}
  .zkr.got{opacity:1}
  .zke{font-size:26px;flex:0 0 auto}
  .zkb{flex:1}
  .zkn{font-size:13px;font-weight:900}
  .zkd{font-size:11px;color:var(--sub);font-weight:600;line-height:1.5;margin-top:3px}
  .zktag{font-size:8px;padding:2px 7px;border-radius:6px;font-weight:800;vertical-align:1px}
  .dupn{font-family:Poppins;font-size:10px;font-weight:800;color:var(--accent);margin-left:2px}
  .zktag.N{background:#EADFD2;color:#7D6A57}
  .zktag.R{background:#F7E9D8;color:#C2571F}
  .zktag.SR{background:#F7E9D8;color:var(--accent)}
  .zktag.H{background:#E9ECFF;color:#4A57C4}
  .row2{display:flex;gap:10px}
  .row2 .btn{flex:1}
  .help{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pop{position:fixed;inset:0;pointer-events:none;z-index:40}
  .pop span{position:absolute;left:50%;top:45%;font-size:24px;animation:fly .8s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">SOCIAL <span>UP!</span></div><div class="sub">中学社会 / 中1〜高校受験</div></div>
    <button class="helpbtn" onclick="renderHelp()" aria-label="使い方">？</button><div class="rankpill" id="rankPill">総合 --</div>
  </div>
  <div id="updBar" style="display:none;align-items:center;gap:10px;background:var(--accent);color:#1A1400;padding:10px 14px;border-radius:12px;margin:0 0 12px;font-size:13px;font-weight:700">
    <b style="flex:1">新しいバージョンがあります</b>
    <button onclick="forceUpdate()" style="background:#1A1400;color:var(--accent);border:0;border-radius:8px;padding:7px 12px;font-weight:800;font-size:12px">更新する</button>
  </div>
  <div style="display:none">
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORE_KEY='socialup_v1';
const OLD_KEYS=[];
try{ if(!localStorage.getItem(STORE_KEY)){
  for(const k of OLD_KEYS){const o=localStorage.getItem(k); if(o){localStorage.setItem(STORE_KEY,o);break;}}
} }catch(e){}
let mem=null;
const FIELDS=[
  ['geo','地理（世界と日本）'],
  ['his','歴史（古代〜現代）'],
  ['civ','公民（政治・経済）']
];
/* 問題データは data/*.json から読み込む。
   分野ごとにファイルを分けてあるので、増やすときはそのファイルに足すだけでよい。 */
const QDIR='data/';
let Q=[], ORDER_Q=[], QMETA=null, qLoad='loading';
async function loadQuestions(){
  const idx=await (await fetch(QDIR+'index.json',{cache:'no-cache'})).json();
  const parts=await Promise.all(idx.sets.map(async st=>{
    const doc=await (await fetch(QDIR+st.file,{cache:'no-cache'})).json();
    return {kind:st.kind||'quiz', items:doc.items};
  }));
  QMETA=idx;
  Q=[].concat.apply([],parts.filter(p=>p.kind==='quiz').map(p=>p.items));
  ORDER_Q=[].concat.apply([],parts.filter(p=>p.kind==='order').map(p=>p.items));
  if(!Q.length)throw new Error('empty');
  qLoad='ok';
}
function loadFailScreen(){
  screen.innerHTML=`<div class="statcard" style="flex-direction:column;text-align:center;gap:10px;margin-top:36px">
    <div style="font-size:34px">⚠️</div>
    <div style="font-weight:900;font-size:15px">問題データを読み込めませんでした</div>
    <p class="help">このアプリは data フォルダと同じ場所に置いて、Webサーバー（GitHub Pages など）経由で
    開いてください。ファイルを直接ダブルクリックして開くと読み込めません。</p>
    <button class="btn btn-primary" style="max-width:220px" onclick="location.reload()">読み込み直す</button></div>`;
}

const LV={easy:{n:'基礎',d:'中1〜中2'},std:{n:'標準',d:'中3'},hard:{n:'入試',d:'高校受験'}};
const FICON={geo:'🗺',his:'🏯',civ:'⚖️'};

function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw);
    const init={stats:{},best:{}};localStorage.setItem(STORE_KEY,JSON.stringify(init));return init;
  }catch(e){if(!mem)mem={stats:{},best:{}};return mem;}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){mem=state;}}
let state=load();
if(!state.stats)state.stats={};
if(!state.best)state.best={};
if(state.xp==null)state.xp=0;
if(state.maxCombo==null)state.maxCombo=0;
if(!state.ach)state.ach=[];
if(!state.streak)state.streak={day:'',count:0};
if(state.taBest==null)state.taBest=0;
if(!state.stat)state.stat={day:'',dayQ:0,fields:[],peakWeak:0};
function bumpQ(){
  const t=todayStr();
  if(state.stat.day!==t){state.stat.day=t;state.stat.dayQ=0;}
  state.stat.dayQ++;
  const h=new Date().getHours();
  if(h<5)unlock('nightowl'); else if(h<8)unlock('earlybird');
  if(state.stat.dayQ>=50)unlock('marathon');
  save();
}
if(!state.cards)state.cards=[];
if(!state.cardCount){
  state.cardCount={};
  (state.cards||[]).forEach(id=>{state.cardCount[id]=(state.cardCount[id]||0)+1;});
}

const EVO=[
 {n:'地図を開く人',e:'🗺'},{n:'方角を知る人',e:'🧭'},{n:'土地を読む人',e:'⛰'},
 {n:'気候を知る人',e:'🌦'},{n:'人の暮らしを見る人',e:'🏘'},{n:'産業を知る人',e:'🏭'},
 {n:'世界をめぐる人',e:'🌏'},{n:'昔をたずねる人',e:'🏺'},{n:'武士の世を知る人',e:'⚔️'},
 {n:'天下を見わたす人',e:'🏯'},{n:'開国を見とどける人',e:'⛵'},{n:'近代を歩く人',e:'🚂'},

function grantCard(){
  chime('card');
  const cnt=state.cardCount||(state.cardCount={});
  const owned=id=>(cnt[id]||0)>0;
  // 未所持は重み3倍。重複も出るが新規が出やすい
  const W={N:6,R:3,SR:1,H:0};
  const build=arr=>{
    let tot=0; const w=arr.map(c=>{const v=(W[c.r]||1)*(owned(c.id)?1:3); tot+=v; return v;});
    return {arr,w,tot};
  };
  const draw=pool=>{
    const {arr,w,tot}=build(pool);
    let x=Math.random()*tot;
    for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i];}
    return arr[arr.length-1];
  };
  const give=(c,isHidden)=>{
    cnt[c.id]=(cnt[c.id]||0)+1;
    if(!state.cards.includes(c.id))state.cards.push(c.id);
    save();
    const dup=cnt[c.id]>1;
    const msg=isHidden
      ? '🔮 隠し図鑑を発見！ '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':'')
      : '📖 図鑑に追加: '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':(c.r==='SR'?'（超レア！）':c.r==='R'?'（レア）':''));
    setTimeout(()=>{toast(msg);pop(dup?6:20);},1400);
  };
  const hid=CARDS.filter(c=>c.r==='H');
  const newHid=hid.filter(c=>!owned(c.id));
  if(hid.length&&Math.random()<0.04){
    give(newHid.length?newHid[Math.floor(Math.random()*newHid.length)]
                      :hid[Math.floor(Math.random()*hid.length)],true);
    return;
  }
  const pool=CARDS.filter(c=>c.r!=='H');
  if(!pool.length)return;
  give(draw(pool),false);
}

const MAXLV=20;
function xpNeed(l){return 40*l+2*l*l;}
function lvlInfo(xp){
  let l=1,acc=0,need=xpNeed(1);
  while(l<MAXLV&&xp>=acc+need){acc+=need;l++;need=xpNeed(l);}
  if(l>=MAXLV)return{level:MAXLV,cur:Math.max(0,xp-acc),need:xpNeed(MAXLV),max:true};
  return{level:l,cur:xp-acc,need};
}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// 端末のローカル時刻での通し日数。「何日ぶりか」の判定に使う
function dayNum(t){const d=t||new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);}
function touchStreak(){
  const t=todayStr();if(state.streak.day===t)return;
  const y=new Date(Date.now()-864e5);
  const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  state.streak.count=(state.streak.day===ys)?state.streak.count+1:1;
  state.streak.day=t;save();
  if(state.streak.count%7===0){toast('🔥 '+state.streak.count+'日連続達成！');grantCard();}
  else if(state.streak.count>=2)toast('🔥 '+state.streak.count+'日連続！');
  checkAch();
}
function addXp(n){
  const before=lvlInfo(state.xp).level;
  state.xp+=n;const after=lvlInfo(state.xp).level;save();
  if(after>before){chime('level');
    pop(20);setTimeout(()=>toast('🎉 Lv.'+after+'！「'+evoTitle(after).n+'」に到達！'),350);
    if(after%2===0)grantCard();   // 偶数レベルのみ
  }
  checkAch();
}
function unlock(id){
  if(state.ach.includes(id))return;
  state.ach.push(id);save();
  const a=achAll().find(x=>x.id===id);
  setTimeout(()=>toast((isSecret(id)?'🕵️ 隠し実績を発見: ':'🏅 実績解除: ')+(a?a.name:id)),700);
  grantCard();
}

function lvCorrect(lv){let n=0;Q.forEach(q=>{if(q.lv===lv&&state.stats[q.id])n+=state.stats[q.id].c;});return n;}
function totalCorrect(){let n=0;Object.keys(state.stats).forEach(k=>n+=state.stats[k].c);return n;}
function checkCardMilestone(){
  if(!state.cardMile)state.cardMile=0;
  const marks=[25,60,110,170,240,320,410,510,620,740,870,1010,1160,1320,1490,1670,1860,2060,2270,2490];
  let due=0; marks.forEach(m=>{if(totalCorrect()>=m)due++;});
  while(state.cardMile<due){state.cardMile++;grantCard();}
  save();

function checkAch(){
  const solved=Object.keys(state.stats).length;
  const lv=lvlInfo(state.xp).level;
  if((state.dailyDone||0)>=7)unlock('daily7');
  if((state.dailyDone||0)>=30)unlock('daily30');
  if(state.maxCombo>=5)unlock('combo5');
  if(state.maxCombo>=10)unlock('combo10');
  if(state.maxCombo>=20)unlock('combo20');
  if(solved>=50)unlock('solve50');
  if(solved>=100)unlock('solve100');
  if(solved>=Q.length)unlock('solveall');
  [['geo','geo50'],['his','his50'],['civ','civ50']]
    .forEach(([f,id])=>{if(fieldCorrect(f)>=50)unlock(id);});
  if(lvCorrect('hard')>=50)unlock('hard50');
  if(state.taBest>=15)unlock('ta15');
  if(state.taBest>=20)unlock('ta20');
  if(state.taBest>=30)unlock('ta30');
  [[3,'streak3'],[7,'streak7'],[14,'streak14'],[30,'streak30']]
    .forEach(([n,id])=>{if(state.streak.count>=n)unlock(id);});
  [[5,'lv5'],[10,'lv10'],[20,'lv20']].forEach(([n,id])=>{if(lv>=n)unlock(id);});
  const cn=cardsNormal().filter(c=>(state.cardCount||{})[c.id]>0).length;
  if(cn>=10)unlock('cards10');
  if(cn>=30)unlock('cards30');
  if(cn>=50)unlock('cards50');
  if(cn>=cardsNormal().length)unlock('cards34');
  if(CARDS.some(c=>c.r==='H'&&(state.cardCount||{})[c.id]>0))unlock('secret');
  if(!state.stat.fields)state.stat.fields=[];
  if(state.stat.fields.length>=3)unlock('allfield');
  const wk=weak().length;
  if(wk>state.stat.peakWeak)state.stat.peakWeak=wk;
  if(state.stat.peakWeak>=10&&wk===0)unlock('comeback');
}

function soundOn(){ return state.sound!==false; }   // 既定はオン
/* iPhone は画面を触った瞬間でないと音を出す準備ができない。
   最初のタップで無音を1回鳴らして解除し、以後は節目でも鳴らせるようにする。 */
let _acReady=false;
function _audio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!window._ac)window._ac=new AC();
    const ac=window._ac;
    if(ac.state==='suspended')ac.resume();
    return ac;
  }catch(e){ return null; }
}
function unlockAudio(){
  const ac=_audio();
  if(!ac||_acReady)return;
  try{
    const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource();
    s.buffer=b; s.connect(ac.destination); s.start(0);
    _acReady=true;
  }catch(e){}
}
['touchend','pointerdown','click','keydown'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, {passive:true});
});
let _chimeAt=0;
function chime(kind){
  if(!soundOn())return;
  const now=Date.now();
  if(now-_chimeAt<450)return;     // レベルアップと図鑑が同時に来たときの二度鳴りを防ぐ
  _chimeAt=now;
  const ac=_audio();
  if(!ac)return;
  try{
    const seq = kind==='level' ? [[523.25,0],[659.25,.10],[783.99,.20],[1046.50,.30]]
              : kind==='card'  ? [[880.00,0],[1174.66,.09]]
              :                  [[659.25,0],[783.99,.10],[1046.50,.20]];
    const dur = kind==='level'?.42:.30;
    seq.forEach(function(p){
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=p[0];
      const t=ac.currentTime+p[1];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(.16,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t+dur+.03);
    });
  }catch(e){}
}

let od=null;
function startOrder(){
  const pool=ORDER_Q.filter(o=>curLv==='all'||o.lv===curLv);
  if(!pool.length){toast('この難易度の整序問題はありません');return;}
  const q=pool[Math.floor(Math.random()*pool.length)];
  // 正解と違う並びになるまでシャッフル
  let idx=q.items.map((_,i)=>i), t=0;
  do{ idx=shuffle(q.items.map((_,i)=>i)); t++; }while(t<20&&idx.every((v,i)=>v===i));
  od={q,order:idx,answered:false};
  renderOrder();
}
function odMove(pos,dir){
  if(od.answered)return;
  const to=pos+dir;
  if(to<0||to>=od.order.length)return;
  const a=od.order;
  [a[pos],a[to]]=[a[to],a[pos]];
  renderOrder(); pop(4);
}
function odCheck(){
  if(od.answered)return;
  od.answered=true;
  const n=od.order.length;
  const hit=od.order.filter((v,i)=>v===i).length;
  const perfect=hit===n;
  const gain=perfect?n*6:hit*3;
  addXp(gain);
  if(perfect){
    state.best.order=(state.best.order||0)+1;   // 全問正解した回数
    unlock('chrono');
    if(state.best.order>=10)unlock('chrono10');
  }
  state.stat=state.stat||{}; bumpQ();
  save(); renderOrder();
}

let g={list:[],i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'all'};
/* ===================== 今日の10問 =====================
   苦手 → そろそろ忘れそうな問題 → まだ解いていない問題、の順に優先度をつけて
   毎日10問だけ選ぶ。たまった数は表に出さない。                        */
const DAILY_N=10, DAILY_WEAK_MAX=4, DAILY_NEW_MAX=4, DAILY_NEW_MIN=2;
function isNewQ(q){ return !state.stats[q.id]; }
function isWeakQ(q){ const s=state.stats[q.id]; return !!(s&&s.w>0&&s.c<=s.w); }
function ivlOfQ(q){ const s=state.stats[q.id]||{c:0,w:0};
  const k=Math.max(0,Math.min(5,(s.c|0)-(s.w|0)*2)); return [1,2,4,8,16,32][k]; }
function dailyScore(q,today){
  const s=state.stats[q.id];
  let sc;
  if(!s) sc=40;                                              // まだ解いていない
  else{
    const el=s.d?today-s.d:60;                               // 何日ぶりか
    if(isWeakQ(q)) sc=100+Math.min(s.wd?today-s.wd:el,30)*2; // 苦手。まちがえてから日が経つほど上げる
    else{ const due=el-ivlOfQ(q); sc=due>=0?60+Math.min(due,30):15+due; }
  }
  if(s&&s.d===today) sc-=1000;                               // 今日もう解いた問題は最後に回す
  return sc+Math.random()*6;
}
function buildDaily(){
  const all=pool('all',curLv);
  if(all.length<4)return [];
  const today=dayNum();
  const sc=all.map(q=>({q:q,s:dailyScore(q,today)})).sort((a,b)=>b.s-a.s);
  const pick=[],used=new Set();
  let nw=0,nn=0;
  for(const it of sc){                                       // 苦手と新規に上限をつけて配合する
    if(pick.length>=DAILY_N)break;
    if(isWeakQ(it.q)){ if(nw>=DAILY_WEAK_MAX)continue; nw++; }
    else if(isNewQ(it.q)){ if(nn>=DAILY_NEW_MAX)continue; nn++; }
    pick.push(it.q);used.add(it.q.id);
  }
  for(const it of sc){                                       // 足りなければ上限を外して補充
    if(pick.length>=DAILY_N)break;
    if(!used.has(it.q.id)){pick.push(it.q);used.add(it.q.id);}
  }
  let now=pick.filter(isNewQ).length;                        // 新しい問題を最低でも数問は入れる
  if(now<DAILY_NEW_MIN){
    for(const it of sc){
      if(now>=DAILY_NEW_MIN)break;
      if(used.has(it.q.id)||!isNewQ(it.q))continue;
      let k=-1;
      for(let j=pick.length-1;j>=0;j--){ if(!isWeakQ(pick[j])&&!isNewQ(pick[j])){k=j;break;} }
      if(k<0)break;
      used.delete(pick[k].id); pick[k]=it.q; used.add(it.q.id); now++;
    }
  }
  return shuffle(pick).slice(0,DAILY_N);
}
function daily(){
  const t=todayStr();
  const d0=state.daily;
  // まだ1問も解いていないときだけ、レベルの変更で作り直す。
  // 解きはじめたあとにレベルを変えても、その日のぶんの進み具合は残す
  const started=!!d0&&((d0.ok.length+d0.ng.length)>0||d0.fin);
  if(!d0||d0.d!==t||(d0.lv!==curLv&&!started)){
    const l=buildDaily();
    if(!l.length)return null;
    state.daily={d:t,lv:curLv,ids:l.map(q=>q.id),ok:[],ng:[],fin:false};
    save();
  }
  return state.daily;
}
function dailyQs(){
  const d=state.daily; if(!d)return [];
  const m=new Map(Q.map(q=>[q.id,q]));
  return d.ids.map(i=>m.get(i)).filter(Boolean);
}
function dailyCard(){
  const d=daily(); if(!d)return '';
  const tot=d.ids.length,done=d.ok.length+d.ng.length,fin=d.fin||done>=tot;
  let sub,go;
  if(fin){ sub='おわり！ '+d.ok.length+'/'+done+' 正解'; go='もう一度'; }
  else if(done>0){ sub='あと '+(tot-done)+' 問'; go='つづき'; }
  else { sub='苦手と新しい問題をまぜてあるよ'; go='はじめる'; }
  return `<div class="daily${fin?' done':''}" onclick="startDaily()">
      <div class="dic">${fin?'🎉':'☀️'}</div>
      <div class="dbd"><h3>今日の${DAILY_N}問</h3><p>${sub}</p>${
        (done>0&&!fin)?`<div class="dbar"><i style="width:${Math.round(done/tot*100)}%"></i></div>`:''}</div>
      <div class="dgo">${go} ›</div>
    </div>`;
}
function startDaily(){
  const d=daily();
  if(!d){toast('問題がまだ足りないよ');return;}
  const done=new Set(d.ok.concat(d.ng));
  let list=dailyQs().filter(q=>!done.has(q.id));
  if(!list.length)list=dailyQs();            // やり終わっていたら同じ10問でもう一周（記録は据え置き）
  if(!list.length){toast('問題がまだ足りないよ');return;}
  clearInterval(g.timer);
  g={list:list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'daily',daily:true};
  renderQuiz();
}
function retryDailyMiss(){
  const list=g.miss.slice();
  if(!list.length){renderHome();return;}
  g={list:list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'daily',daily:true};

}
function finishDaily(){
  clearInterval(g.timer);
  const d=state.daily,total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const alldone=!!d&&(d.ok.length+d.ng.length)>=d.ids.length;

  unlock('first');
  if(total>=DAILY_N&&g.score===total)unlock('perfect');
  checkAch();
  const msg=rate===100?'全問正解！かんぺき':rate>=80?'いい調子！':rate>=50?'ここが伸びしろ':'今日のぶん、やりきったね';
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題（明日また出るよ）</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>${alldone?'今日のぶんは完了':'あと '+Math.max(0,d.ids.length-(d.ok.length+d.ng.length))+' 問'}${
        state.streak.count>=2?' ／ 🔥'+state.streak.count+'日連続':''}</p>
    </div>
    ${miss}
    <p class="help" style="text-align:center;margin:10px 0 0">明日はまた新しい${DAILY_N}問が出るよ</p>
    <div class="row2" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      ${g.miss.length?`<button class="btn btn-primary" onclick="retryDailyMiss()">まちがえた ${g.miss.length} 問をもう一度</button>`
                     :`<button class="btn btn-primary" onclick="startDaily()">もう一度</button>`}
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}

function startQuiz(field,ta){

  if(field==='weak'){list=shuffle(weak());if(!list.length){toast('苦手はまだないよ');return;}list=list.slice(0,10);}

    if(list.length<4){toast('この条件の問題が足りないよ');return;}
    list=shuffle(list).slice(0,ta?40:10);}
  g={list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:!!ta,t:ta?60:0,timer:null,field};
  renderQuiz();
}
function renderQuiz(){
  if(g.i>=g.list.length)return finish();
  clearInterval(g.timer);
  const q=g.list[g.i];g.answered=false;
  const opts=shuffle(q.ch.map((c,k)=>({c,k})));
  screen.innerHTML=`
    <button class="back" onclick="quitQuiz()">‹ もどる</button>
    <div class="qhead"><div class="left"><h2>${g.ta?'⏱ タイムアタック':'📝 クイズ'}</h2>
      ${g.combo>=2?`<span class="combo">🔥 ${g.combo}コンボ</span>`:''}</div>
      ${g.ta?`<span class="timer" id="tm">${g.t}</span>`:`<span class="combo">${g.i+1}/${g.list.length}</span>`}</div>
    <div class="bar-top"><i style="width:${g.i/g.list.length*100}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="tagf">${esc(fieldName(q.f))}</span><span class="taglv ${q.lv}">${LV[q.lv].n}</span></div>
      <div class="qtext">${esc(q.q)}</div>
    </div>
    <div class="choices">${opts.map(o=>`<button class="choice" data-k="${o.k}" onclick="answer(${o.k})">${esc(o.c)}</button>`).join('')}</div>
    <div id="fb"></div>`;
  if(g.ta){g.timer=setInterval(()=>{g.t--;const el=$('tm');
    if(el){el.textContent=g.t;if(g.t<=5)el.classList.add('warn');}
    if(g.t<=0){clearInterval(g.timer);g.answered=true;finish();}},1000);}
}
function answer(k){
  if(g.answered)return;g.answered=true;clearInterval(g.timer);
  const q=g.list[g.i],ok=k===q.a;
  document.querySelectorAll('.choice').forEach(b=>{const kk=+b.dataset.k;
    if(kk===q.a)b.classList.add('correct');else if(kk===k)b.classList.add('wrong');else b.classList.add('dim');b.onclick=null;});
  const st=state.stats[q.id]||{c:0,w:0};
  bumpQ();
  if(ok)setTimeout(checkCardMilestone,50);
  if(!state.stat.fields)state.stat.fields=[];
  if(!state.stat.fields.includes(q.f)){state.stat.fields.push(q.f);}
  if(ok){g.score++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    if(g.combo>state.maxCombo)state.maxCombo=g.combo;
    st.c++;
    addXp(XPLV[q.lv]+(g.combo>=5?10:g.combo>=3?5:0));touchStreak();
    pop(g.combo>=3?14:8);}
  else{g.combo=0;g.miss.push(q);st.w++;}
  st.d=dayNum(); if(!ok)st.wd=st.d;
  if(g.daily&&state.daily&&!state.daily.ok.includes(q.id)&&!state.daily.ng.includes(q.id))
    (ok?state.daily.ok:state.daily.ng).push(q.id);
  state.stats[q.id]=st;save();
  const head=k===-1?'⏰ 時間切れ':(ok?'⭕ 正解':'❌ 不正解');
  $('fb').innerHTML=`<div class="exp"><b>${head}</b>　${esc(q.ex)}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="next()">次へ ›</button>`;
  $('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){g.i++;renderQuiz();}
function quitQuiz(){clearInterval(g.timer);renderHome();}
function finish(){
  if(g.daily)return finishDaily();
  clearInterval(g.timer);
  const total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const key=(g.field||'all')+'_'+curLv+(g.ta?'_ta':'');
  const prev=state.best[key]||0;const isBest=g.score>prev;
  if(isBest){state.best[key]=g.score;save();}
  unlock('first');
  if(g.ta&&g.score>state.taBest){state.taBest=g.score;save();}
  if(!g.ta&&total>=10&&g.score===total)unlock('perfect');
  checkAch();
  const msg={S:'完璧！文句なし',A:'すばらしい理解度',B:'いい調子、あと少し',C:'解説を読んで固めよう',D:'まずは易しめから'}[rk];
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>正答率 ${rate}% ／ 最大 ${g.maxCombo} コンボ</p>
      ${isBest?'<p style="color:var(--accent);font-weight:800">🏅 自己ベスト更新！</p>':`<p>この条件のベスト: ${Math.max(prev,g.score)}問</p>`}
    </div>
    ${miss}
    <div class="row2" style="margin-top:8px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startQuiz('${g.field}',${g.ta})">もう一回</button>
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}
/* 問題を読み込んでから描画する */
screen.innerHTML=`<div class="statcard" style="flex-direction:column;text-align:center;gap:10px;margin-top:36px">
  <div style="font-size:34px">🗺</div><div style="font-weight:900;font-size:15px">問題を読み込み中...</div></div>`;
loadQuestions().then(()=>{ renderHome(); }).catch(()=>{ qLoad='fail'; loadFailScreen(); });
setTimeout(()=>checkUpdate(true),1500);

/* Service Worker の登録（オフライン対応） */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
