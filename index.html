<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2571F">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOCIAL UP!">
<title>SOCIAL UP! 中学社会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6F0;--panel:#FFFFFF;--panel2:#F6EDE3;
    --primary:#C2571F;--primary-dark:#9B4415;--accent:#C79212;
    --danger:#E03B50;--text:#241A12;--sub:#7D6A57;--border:#EADFD2;
    --shadow:0 8px 28px rgba(194,87,31,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 0%,#F4E6D6 0%,#FBF6F0 55%);min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  .topbar{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#FBF6F0 70%,rgba(251,246,240,0))}
  .brand .logo{font-family:'Poppins';font-weight:800;font-size:23px;letter-spacing:-.5px;color:var(--primary)}
  .brand .logo span{color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
  .rankpill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;color:var(--accent)}
  .screen{flex:1;overflow-y:auto;padding:6px 20px 40px;-webkit-overflow-scrolling:touch}
  .statcard{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:92px;height:92px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-family:'Poppins';font-size:23px;font-weight:800;color:var(--primary);line-height:1}
  .ring .in small{font-size:9px;color:var(--sub);font-weight:600;margin-top:2px}
  .stinfo h2{font-size:15px;font-weight:900;margin-bottom:8px}
  .stinfo .row{display:flex;gap:16px}
  .stinfo .row div{font-size:11px;color:var(--sub);font-weight:600}
  .stinfo .row b{display:block;font-family:'Poppins';font-size:19px;color:var(--text);font-weight:700}
  .label{font-size:12px;font-weight:800;color:var(--sub);margin:10px 2px 10px;letter-spacing:.3px}
  .lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
  .lvbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}
  .lvbtn:active{transform:scale(.97)}
  .lvbtn .n{font-size:13px;font-weight:900;display:block}
  .lvbtn .d{font-size:9px;color:var(--sub);font-weight:600;margin-top:3px;display:block}
  .lvbtn.on{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
  .lvbtn.on .d{color:rgba(8,32,26,.7)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:15px;padding:14px;cursor:pointer;transition:.15s;text-align:left}
  .fbtn:active{transform:scale(.98)}
  .fbtn .ic{font-size:20px}
  .fbtn .n{font-size:13px;font-weight:800;margin-top:5px}
  .fbtn .m{font-size:10px;color:var(--sub);font-weight:600;margin-top:3px}
  .fbtn .bar{height:4px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden}
  .fbtn .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
  .btn{border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer;transition:.15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#FFFFFF}
  .btn-ghost{background:var(--panel);color:var(--primary);border:1.5px solid var(--border)}
  .btn-accent{background:var(--accent);color:#6B4A00}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer;padding:6px 2px;margin-bottom:6px;font-family:inherit}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qhead .left{display:flex;align-items:center;gap:10px}
  .qhead h2{font-size:16px;font-weight:900}
  .timer{font-family:'Poppins';font-weight:800;font-size:20px;color:var(--accent)}
  .timer.warn{color:var(--danger)}
  .combo{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--accent)}
  .bar-top{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar-top i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tagf{font-size:10px;font-weight:800;color:var(--primary);letter-spacing:.4px}
  .taglv{font-size:9px;padding:3px 8px;border-radius:7px;font-weight:800}
  .taglv.easy{background:#F7E9D8;color:#C2571F}
  .taglv.std{background:#FFF6E2;color:var(--accent)}
  .taglv.hard{background:#FFE8EC;color:var(--danger)}
  .taglv.ibo{background:#F0E6FA;color:#7A3FC4}
  .lvbtn .n{font-size:12px}
  .qtext{font-size:17px;font-weight:700;line-height:1.55}
  .choices{display:grid;gap:9px}
  .choice{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--text);cursor:pointer;text-align:left;transition:.12s;line-height:1.45}
  .choice:active{transform:scale(.99)}
  .choice.correct{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
  .choice.wrong{background:var(--danger);border-color:var(--danger);color:#7A0012}
  .choice.dim{opacity:.4}
  .exp{border-radius:14px;padding:15px;margin-top:12px;font-size:13px;line-height:1.65;background:var(--panel2);border:1px solid var(--border)}
  .exp b{color:var(--primary)}
  .result{text-align:center;padding:26px 10px}
  .result .rank{font-family:'Poppins';font-size:62px;font-weight:800;line-height:1;color:var(--accent)}
  .result .emoji{font-size:48px;margin-bottom:4px}
  .result .big{font-family:'Poppins';font-size:44px;font-weight:800;color:var(--primary);line-height:1;margin-top:6px}
  .result h2{font-size:18px;font-weight:900;margin:10px 0 4px}
  .result p{color:var(--sub);font-weight:600;font-size:13px;margin-bottom:6px}
  .misslist{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:4px;margin:14px 0;max-height:260px;overflow-y:auto}
  .misslist .r{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
  .misslist .r:last-child{border:none}
  .misslist .r .q{font-weight:700;margin-bottom:4px}
  .misslist .r .a{color:var(--primary);font-weight:700;font-size:12px}
  .lvstat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lvstat:last-child{margin-bottom:0}
  .lvstat .ln{font-size:10px;font-weight:800;width:50px;flex:0 0 auto}
  .lvstat .ln.lv-easy{color:#C2571F}
  .lvstat .ln.lv-std{color:var(--accent)}
  .lvstat .ln.lv-hard{color:var(--danger)}
  .lvstat .ln.lv-ibo{color:#7A3FC4}
  .lvstat .lb{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
  .lvstat .lb i{display:block;height:100%;border-radius:99px}
  .lvstat .lb i.lv-easy{background:#C2571F}
  .lvstat .lb i.lv-std{background:var(--accent)}
  .lvstat .lb i.lv-hard{background:var(--danger)}
  .lvstat .lb i.lv-ibo{background:#7A3FC4}
  .lvstat .lnum{font-family:'Poppins';font-size:10px;font-weight:700;color:var(--sub);width:48px;text-align:right;flex:0 0 auto}
  .lvstat .lrate{font-family:'Poppins';font-size:10px;font-weight:800;width:34px;text-align:right;flex:0 0 auto}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .achb{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:9px 8px;opacity:.5}
  .achb.got{opacity:1;border-color:var(--accent);background:#FFF6E2}
  .achb .an{font-size:10px;font-weight:800;line-height:1.3}
  .achb .ad{font-size:8px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.3}
    .evr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:7px;opacity:.45}
  .evr.got{opacity:1}
  .evr.cur{border-color:var(--accent);background:#FFF6E2;box-shadow:0 0 0 1.5px var(--accent) inset}
  .evr .evn{font-family:'Poppins';font-size:11px;font-weight:800;color:var(--sub);width:20px;flex:0 0 auto;text-align:right}
  .evr .eve{font-size:22px;flex:0 0 auto}
  .evr .evb{flex:1;min-width:0}
  .evr .evt{font-size:13px;font-weight:800;line-height:1.35}
  .evr .evd{font-family:'Poppins';font-size:10px;color:var(--sub);font-weight:700;margin-top:2px}
  .evr.cur .evd{color:var(--accent)}
  .odr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .odr.ok{border-color:#2E9E6B;background:#EAF7F0}
  .odr.ok .odn{background:#2E9E6B;color:#FFFFFF}
  .odr.ng{border-color:var(--danger)}
  .odr .odn{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--panel2);color:var(--sub);font-family:Poppins;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .odr .odb{flex:1;min-width:0}
  .odr .odt{font-size:13.5px;font-weight:700;line-height:1.45}
  .odr .odd{font-size:11px;color:var(--sub);line-height:1.6;margin-top:4px}
  .odr .odd b{color:var(--accent)}
  .odr .odmark{font-size:20px;font-weight:900;flex:0 0 auto;line-height:1}
  .odr .odbtns{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
  .odr .odbtns button{width:34px;height:24px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:7px;font-size:11px;line-height:1;padding:0}
  .odr .odbtns button:disabled{opacity:.3}
  .zkr{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;opacity:.55}
  .zkr.got{opacity:1}
  .zke{font-size:26px;flex:0 0 auto}
  .zkb{flex:1}
  .zkn{font-size:13px;font-weight:900}
  .zkd{font-size:11px;color:var(--sub);font-weight:600;line-height:1.5;margin-top:3px}
  .zktag{font-size:8px;padding:2px 7px;border-radius:6px;font-weight:800;vertical-align:1px}
  .zktag.N{background:#EADFD2;color:#7D6A57}
  .zktag.R{background:#F7E9D8;color:#C2571F}
  .zktag.SR{background:#F7E9D8;color:var(--accent)}
  .zktag.H{background:#E9ECFF;color:#4A57C4}
  .row2{display:flex;gap:10px}
  .row2 .btn{flex:1}
  .help{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pop{position:fixed;inset:0;pointer-events:none;z-index:40}
  .pop span{position:absolute;left:50%;top:45%;font-size:24px;animation:fly .8s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">SOCIAL <span>UP!</span></div><div class="sub">中学社会 / 中1〜高校受験</div></div>
    <div class="rankpill" id="rankPill">総合 --</div>
  </div>
  <div id="updBar" style="display:none;align-items:center;gap:10px;background:var(--accent);color:#1A1400;padding:10px 14px;border-radius:12px;margin:0 0 12px;font-size:13px;font-weight:700">
    <b style="flex:1">新しいバージョンがあります</b>
    <button onclick="forceUpdate()" style="background:#1A1400;color:var(--accent);border:0;border-radius:8px;padding:7px 12px;font-weight:800;font-size:12px">更新する</button>
  </div>
  <div style="display:none">
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORE_KEY='socialup_v1';
const OLD_KEYS=[];
try{ if(!localStorage.getItem(STORE_KEY)){
  for(const k of OLD_KEYS){const o=localStorage.getItem(k); if(o){localStorage.setItem(STORE_KEY,o);break;}}
} }catch(e){}
let mem=null;
const FIELDS=[
  ['geo','地理（世界と日本）'],
  ['his','歴史（古代〜現代）'],
  ['civ','公民（政治・経済）']
];
const Q=[
  {id:'g_e1',f:'geo',lv:'easy',q:'地球上の位置を表すとき、赤道を0度として南北を測るものはどれか。',ch:['緯度','経度','標高','時差'],a:0,ex:'赤道が緯度0度で、南北にそれぞれ90度まである。経度はイギリスの旧グリニッジ天文台を0度として東西に180度まで。'},
  {id:'g_e2',f:'geo',lv:'easy',q:'世界の六大陸に含まれないものはどれか。',ch:['ユーラシア大陸','アフリカ大陸','南極大陸','グリーンランド'],a:3,ex:'六大陸はユーラシア・アフリカ・北アメリカ・南アメリカ・オーストラリア・南極。グリーンランドは世界最大の島。'},
  {id:'g_e3',f:'geo',lv:'easy',q:'三大洋に含まれないものはどれか。',ch:['太平洋','大西洋','インド洋','地中海'],a:3,ex:'三大洋は太平洋・大西洋・インド洋。地中海はヨーロッパ・アジア・アフリカに囲まれた海。'},
  {id:'g_e4',f:'geo',lv:'easy',q:'日本の標準時子午線が通る都市はどこか。',ch:['東京','大阪','明石','那覇'],a:2,ex:'兵庫県明石市を通る東経135度が日本の標準時子午線。'},
  {id:'g_e5',f:'geo',lv:'easy',q:'経度差15度で生じる時差は何時間か。',ch:['1時間','2時間','3時間','15時間'],a:0,ex:'地球は24時間で360度回るので、360÷24＝15度で1時間。'},
  {id:'g_e6',f:'geo',lv:'easy',q:'一年中気温が高く降水量も多い気候帯はどれか。',ch:['熱帯','乾燥帯','温帯','寒帯'],a:0,ex:'赤道付近に広がる熱帯。熱帯雨林気候とサバナ気候に分かれる。'},
  {id:'g_e7',f:'geo',lv:'easy',q:'日本の大部分が属する気候帯はどれか。',ch:['熱帯','乾燥帯','温帯','寒帯'],a:2,ex:'日本の大部分は温帯（温暖湿潤気候）。北海道は冷帯（亜寒帯）。'},
  {id:'g_e8',f:'geo',lv:'easy',q:'日本の国土面積はおよそどれくらいか。',ch:['約8万km2','約38万km2','約100万km2','約380万km2'],a:1,ex:'約38万km2。世界では60番台の広さで、決して小さくはない。'},
  {id:'g_e9',f:'geo',lv:'easy',q:'日本の排他的経済水域が国土面積に比べて広い理由はどれか。',ch:['島が多く南北に長いから','人口が多いから','山が多いから','工業がさかんだから'],a:0,ex:'離島が多いため。沖ノ鳥島など小さな島も水域の維持に重要な役割を果たす。'},
  {id:'g_e10',f:'geo',lv:'easy',q:'日本の国土のうち山地が占める割合はおよそどれくらいか',ch:['約25%','約50%','約75%','約90%'],a:2,ex:'約4分の3が山地。平野は限られ、人口や産業が集中する。'},
  {id:'g_e11',f:'geo',lv:'easy',q:'日本アルプスに含まれない山脈はどれか。',ch:['飛驒山脈','木曽山脈','赤石山脈','奥羽山脈'],a:3,ex:'日本アルプスは飛驒・木曽・赤石の3山脈。奥羽山脈は東北地方を南北に走る。'},
  {id:'g_e12',f:'geo',lv:'easy',q:'日本で最も長い川はどれか。',ch:['信濃川','利根川','石狩川','木曽川'],a:0,ex:'信濃川が最長（約367km）、流域面積が最大なのは利根川。'},
  {id:'g_e13',f:'geo',lv:'easy',q:'日本の川の特徴として正しいものはどれか。',ch:['長くて流れがゆるやか','短くて流れが急','川幅が広い','水量が一定'],a:1,ex:'国土が狭く山地が海に迫るため、世界の大河と比べて短く急流。'},
  {id:'g_e14',f:'geo',lv:'easy',q:'太平洋側の気候の特徴はどれか。',ch:['夏に雨が多く冬は乾燥','冬に雪が多い','一年中降水量が少ない','一年中冷涼'],a:0,ex:'夏の南東季節風で降水が多く、冬は山を越えた乾いた風で晴れる。'},
  {id:'g_e15',f:'geo',lv:'easy',q:'瀬戸内の気候で降水量が少ない理由はどれか。',ch:['両側の山地が季節風をさえぎるから','標高が高いから','海流の影響','緯度が低いから'],a:0,ex:'中国山地と四国山地に挟まれ、夏冬どちらの季節風も雨を落としたあとの風が届くため。'},
  {id:'g_e16',f:'geo',lv:'easy',q:'日本の人口ピラミッドの現在の形はどれか。',ch:['富士山型','つりがね型','つぼ型','ひょうたん型'],a:2,ex:'少子高齢化が進み、若年層が細いつぼ型。かつては富士山型だった。'},
  {id:'g_e17',f:'geo',lv:'easy',q:'三大都市圏に含まれないものはどれか。',ch:['東京圏','名古屋圏','大阪圏','福岡圏'],a:3,ex:'三大都市圏は東京・名古屋・大阪。福岡は地方中枢都市。'},
  {id:'g_e18',f:'geo',lv:'easy',q:'促成栽培の説明として正しいものはどれか。',ch:['出荷時期を早める','出荷時期を遅らせる','品種を増やす','農薬を減らす'],a:0,ex:'温暖な気候やビニールハウスを使い、他産地より早く出荷する。高知や宮崎が代表。'},

  {id:'h_s5',f:'his',lv:'std',q:'勘合貿易で勘合という証明書を用いた理由はどれか。',ch:['倭寇と正式な貿易船を区別するため','税を集めるため','船の大きさを測るため','人数を数えるため'],a:0,ex:'足利義満が明と行った貿易。倭寇の取り締まりを求められたことが背景。'},

  {id:'h_s7',f:'his',lv:'std',q:'太閤検地の意義として正しいものはどれか。',ch:['全国の土地を統一基準で測り年貢の基礎を作った','貿易を始めた','城を建てた','刀を集めた'],a:0,ex:'ものさしやますを統一し、耕作者を検地帳に記録した。これにより荘園制が終わった。'},
  {id:'h_s8',f:'his',lv:'std',q:'江戸幕府が参勤交代を制度化した目的はどれか。',ch:['大名に費用を負担させ力を弱めるため','交通を発展させるため','人口を調べるため','農業を進めるため'],a:0,ex:'往復の費用と江戸での生活費が大名の財政を圧迫した。副産物として街道や宿場が発達した。'},
  {id:'h_s9',f:'his',lv:'std',q:'享保の改革を行った人物はだれか。',ch:['徳川吉宗','徳川綱吉','松平定信','水野忠邦'],a:0,ex:'目安箱の設置、公事方御定書、上米の制などを行った。'},
  {id:'h_s10',f:'his',lv:'std',q:'日米修好通商条約が不平等とされた理由はどれか。',ch:['領事裁判権を認め関税自主権がなかった','領土を割譲したから','賠償金を払ったから','軍隊が駐留したから'],a:0,ex:'外国人の犯罪を日本が裁けず、輸入品の関税を自由に決められなかった。'},
  {id:'h_s11',f:'his',lv:'std',q:'地租改正の内容として正しいものはどれか。',ch:['地価の3%を現金で納めさせた','収穫の3%を米で納めさせた','税を廃止した','土地を国有にした'],a:0,ex:'収穫に左右されない安定した財源を得るため、現金納に改めた。農民の負担は重く一揆も起きた。'},
  {id:'h_s12',f:'his',lv:'std',q:'自由民権運動の中心的な主張はどれか。',ch:['国会の開設と憲法の制定','鎖国の維持','幕府の復活','軍備の拡大'],a:0,ex:'板垣退助らが民撰議院設立建白書を提出し、政府に国会開設を求めた。'},
  {id:'h_s13',f:'his',lv:'std',q:'日露戦争の講和条約で日本が得られなかったものはどれか。',ch:['賠償金','樺太南部','南満州鉄道の権益','韓国での優越権'],a:0,ex:'賠償金が得られず、増税に苦しんだ国民の不満から日比谷焼き打ち事件が起きた。'},
  {id:'h_s14',f:'his',lv:'std',q:'大正デモクラシーを象徴する出来事はどれか。',ch:['普通選挙法の成立','徴兵令の公布','大政翼賛会の結成','治安維持法の廃止'],a:0,ex:'1925年、25歳以上の男子に選挙権が与えられた。同時に治安維持法も成立した点が重要。'},
  {id:'h_s15',f:'his',lv:'std',q:'世界恐慌に対してアメリカが行った政策はどれか。',ch:['ニューディール政策','ブロック経済','五か年計画','鎖国'],a:0,ex:'公共事業で雇用を生み出した。イギリスやフランスはブロック経済、ソ連は五か年計画。'},
  {id:'h_s16',f:'his',lv:'std',q:'戦後の民主化政策に含まれないものはどれか。',ch:['農地改革','財閥解体','教育基本法の制定','徴兵制の導入'],a:3,ex:'非軍事化と民主化が方針。徴兵制の導入は正反対。'},
  {id:'h_s17',f:'his',lv:'std',q:'1951年に結ばれ、日本が独立を回復した条約はどれか。',ch:['サンフランシスコ平和条約','日米安全保障条約','日ソ共同宣言','日中平和友好条約'],a:0,ex:'翌1952年に発効し独立を回復した。同時に日米安全保障条約も結ばれた。'},
  {id:'h_s18',f:'his',lv:'std',q:'高度経済成長期に起きた問題はどれか。',ch:['公害の深刻化','人口減少','食料の余剰','失業率の急上昇'],a:0,ex:'四大公害病が発生し、1967年に公害対策基本法が制定された。'},
  {id:'h_h1',f:'his',lv:'hard',q:'律令制のもとで、農民が負担した税のうち特産物を納めるものはどれか。',ch:['租','調','庸','雑徭'],a:1,ex:'租は稲、調は特産物、庸は労役の代わりの布。雑徭は地方での労役。'},
  {id:'h_h2',f:'his',lv:'hard',q:'鎌倉時代に地頭が設置された目的はどれか。',ch:['荘園の管理と年貢の徴収','外交の担当','裁判の実施','貿易の管理'],a:0,ex:'源頼朝が守護（軍事・警察）と地頭（土地管理）を置き、全国支配の基礎とした。'},
  {id:'h_h3',f:'his',lv:'hard',q:'室町時代の惣（惣村）の説明として正しいものはどれか。',ch:['農民が自治的に運営した村の組織','武士の集まり','商人の同業組合','寺院の組織'],a:0,ex:'寄合で村のおきてを定め、年貢を請け負うこともあった。座は商工業者の同業組合。'},
  {id:'h_h4',f:'his',lv:'hard',q:'江戸時代の三大改革の順序として正しいものはどれか。',ch:['享保→寛政→天保','寛政→享保→天保','天保→享保→寛政','享保→天保→寛政'],a:0,ex:'徳川吉宗の享保、松平定信の寛政、水野忠邦の天保の順。'},
  {id:'h_h5',f:'his',lv:'hard',q:'開国後に日本で物価が上昇した理由として正しいものはどれか。',ch:['金が大量に海外へ流出したから','人口が急増したから','農業が衰えたから','鎖国が続いたから'],a:0,ex:'日本と海外で金銀の交換比率が違ったため金が流出し、貨幣の質を落としたことで物価が上がった。'},
  {id:'h_h6',f:'his',lv:'hard',q:'明治政府の富国強兵を支えた殖産興業の代表的な官営工場はどれか。',ch:['富岡製糸場','八幡製鉄所','足尾銅山','三池炭鉱'],a:0,ex:'富岡製糸場は生糸の増産と技術指導のために設立された官営模範工場。八幡製鉄所は日清戦争後。'},
  {id:'h_h7',f:'his',lv:'hard',q:'第一次世界大戦中に日本経済が好況となった理由はどれか。',ch:['ヨーロッパの生産が止まりアジア市場へ輸出が伸びた','戦争に勝ったから','資源が見つかったから','関税を下げたから'],a:0,ex:'交戦国が生産できなくなった分の需要を日本が引き受け、大戦景気となった。'},
  {id:'h_h8',f:'his',lv:'hard',q:'五・一五事件と二・二六事件に共通することはどれか。',ch:['軍部が政治的影響力を強める契機となった','外国との戦争が始まった','憲法が改正された','政党が強くなった'],a:0,ex:'政党政治が終わり、軍部の発言力が強まった。五・一五で犬養毅首相が殺害された。'},
  {id:'h_h9',f:'his',lv:'hard',q:'冷戦の始まりを示す出来事として適切なものはどれか。',ch:['ドイツの東西分裂','日中戦争','ベルサイユ条約','世界恐慌'],a:0,ex:'アメリカ中心の西側とソ連中心の東側の対立。ベルリンの壁が象徴。'},
  {id:'h_h10',f:'his',lv:'hard',q:'日本が国際連合に加盟できた直接のきっかけはどれか。',ch:['日ソ共同宣言でソ連の反対がなくなった','サンフランシスコ平和条約','日米安全保障条約','日韓基本条約'],a:0,ex:'1956年の日ソ共同宣言で国交が回復し、ソ連の拒否権が外れて加盟が実現した。'},
  {id:'c_e1',f:'civ',lv:'easy',q:'日本国憲法の三大原則に含まれないものはどれか。',ch:['国民主権','基本的人権の尊重','平和主義','三権分立'],a:3,ex:'三大原則は国民主権・基本的人権の尊重・平和主義。三権分立は統治のしくみ。'},
  {id:'c_e2',f:'civ',lv:'easy',q:'日本国憲法で戦争放棄を定めた条文はどれか。',ch:['第1条','第9条','第25条','第96条'],a:1,ex:'第9条で戦争の放棄、戦力の不保持、交戦権の否認を定めている。'},
  {id:'c_e3',f:'civ',lv:'easy',q:'生存権を定めた憲法第25条の内容はどれか。',ch:['健康で文化的な最低限度の生活を営む権利','裁判を受ける権利','投票する権利','職業を選ぶ権利'],a:0,ex:'社会権の中心。生活保護などの社会保障制度の根拠になっている。'},
  {id:'c_e4',f:'civ',lv:'easy',q:'基本的人権のうち、自由権に含まれるものはどれか。',ch:['信教の自由','教育を受ける権利','選挙権','生存権'],a:0,ex:'自由権は精神・身体・経済活動の自由。教育や生存は社会権、選挙権は参政権。'},
  {id:'c_e5',f:'civ',lv:'easy',q:'日本の国会が二院制をとる理由として正しいものはどれか。',ch:['慎重に審議し行き過ぎを防ぐため','議員を増やすため','費用を減らすため','裁判を行うため'],a:0,ex:'衆議院と参議院で二度審議することで、一方の行き過ぎを抑える。'},
  {id:'c_e6',f:'civ',lv:'easy',q:'内閣総理大臣を指名するのはどこか。',ch:['国会','内閣','裁判所','天皇'],a:0,ex:'国会が指名し、天皇が任命する。'},
  {id:'c_e7',f:'civ',lv:'easy',q:'法律が憲法に違反していないかを判断する権限を何というか。',ch:['違憲審査権','立法権','行政権','弾劾裁判'],a:0,ex:'裁判所が持つ。最終判断を行う最高裁判所は「憲法の番人」と呼ばれる。'},
  {id:'c_e8',f:'civ',lv:'easy',q:'衆議院の解散を決められるのはどれか。',ch:['内閣','参議院','裁判所','天皇'],a:0,ex:'内閣が決定する。衆議院は内閣不信任決議を出せる（抑制と均衡）。'},
  {id:'c_e9',f:'civ',lv:'easy',q:'日本の選挙権が与えられる年齢はどれか。',ch:['16歳以上','18歳以上','20歳以上','25歳以上'],a:1,ex:'2016年から18歳以上に引き下げられた。被選挙権は衆議院25歳、参議院30歳以上。'},
  {id:'c_e10',f:'civ',lv:'easy',q:'地方公共団体の住民が持つ直接請求権に含まれないものはどれか。',ch:['条例の制定・改廃の請求','議会の解散請求','首長の解職請求','法律の制定請求'],a:3,ex:'法律を作るのは国会。地方では条例の制定改廃、解散、解職などを請求できる。'},
  {id:'c_e11',f:'civ',lv:'easy',q:'需要量が供給量を上回っているとき、一般に価格はどうなるか。',ch:['上がる','下がる','変わらない','ゼロになる'],a:0,ex:'品不足になり価格が上がる。逆に供給が多いと価格は下がる。'},
  {id:'c_e12',f:'civ',lv:'easy',q:'日本銀行の役割として正しくないものはどれか。',ch:['紙幣を発行する','政府の資金を扱う','銀行にお金を貸す','個人に住宅ローンを貸す'],a:3,ex:'日本銀行は「発券銀行」「政府の銀行」「銀行の銀行」。個人とは取引しない。'},
  {id:'c_e13',f:'civ',lv:'easy',q:'税のうち、納める人と負担する人が異なるものはどれか。',ch:['直接税','間接税','関税のみ','地方税のみ'],a:1,ex:'消費税が代表例。所得税や法人税は納税者と負担者が同じ直接税。'},
  {id:'c_e14',f:'civ',lv:'easy',q:'社会保障制度の四つの柱に含まれないものはどれか。',ch:['社会保険','公的扶助','社会福祉','公共事業'],a:3,ex:'四つの柱は社会保険・公的扶助・社会福祉・公衆衛生。'},
  {id:'c_e15',f:'civ',lv:'easy',q:'国際連合で世界の平和と安全に主要な責任を持つ機関はどれか。',ch:['安全保障理事会','総会','国際司法裁判所','事務局'],a:0,ex:'常任理事国5か国は拒否権を持つ。'},
  {id:'c_s1',f:'civ',lv:'std',q:'日本国憲法の改正に必要な手続きとして正しいものはどれか.',ch:['各議院の総議員の3分の2以上の賛成と国民投票での過半数','国会の過半数のみ','内閣の決定','裁判所の承認'],a:0,ex:'厳格な手続きが定められた硬性憲法。国民投票で過半数の賛成が必要。'},
  {id:'c_s2',f:'civ',lv:'std',q:'「新しい人権」に含まれるものはどれか。',ch:['環境権やプライバシーの権利','信教の自由','財産権','裁判を受ける権利'],a:0,ex:'社会の変化にともない主張されるようになった権利。憲法に明記はないが幸福追求権などを根拠とする。'},
  {id:'c_s3',f:'civ',lv:'std',q:'小選挙区制の特徴として正しいものはどれか。',ch:['大政党に有利で死票が多い','小政党に有利','死票が少ない','必ず連立政権になる'],a:0,ex:'1選挙区1名なので当選者以外への票が死票になりやすい。政権が安定しやすい面もある。'},
  {id:'c_s4',f:'civ',lv:'std',q:'比例代表制の特徴として正しいものはどれか。',ch:['得票に応じて議席が配分され死票が少ない','大政党に非常に有利','1人しか当選しない','無所属に有利'],a:0,ex:'民意を反映しやすいが、小政党が分立して 政治が不安定になることもある。'},
  {id:'c_s5',f:'civ',lv:'std',q:'三権分立において、国会が裁判所に対して持つ権限はどれか。',ch:['弾劾裁判所の設置','違憲審査','解散','内閣不信任'],a:0,ex:'ふさわしくない裁判官を辞めさせる裁判を行う。裁判所は国会の立法に違憲審査を行う。'},
  {id:'c_s6',f:'civ',lv:'std',q:'裁判員制度の説明として正しいものはどれか。',ch:['国民が重大な刑事裁判の第一審に参加する','すべての裁判に参加する','民事裁判に参加する','裁判官の代わりを務める'],a:0,ex:'重大な刑事事件の第一審で、裁判官とともに有罪無罪と量刑を判断する。'},
  {id:'c_s7',f:'civ',lv:'std',q:'三審制がとられている理由はどれか。',ch:['慎重な審理で誤りを防ぐため','裁判を早く終えるため','費用を減らすため','裁判官を減らすため'],a:0,ex:'原則3回まで審理を受けられる。控訴・上告により誤判を防ぐ。'},
  {id:'c_s8',f:'civ',lv:'std',q:'株式会社における株主の責任の範囲はどれか。',ch:['出資した金額の範囲まで','会社の借金すべて','無制限','責任はない'],a:0,ex:'有限責任。倒産しても出資額を失うだけで、それ以上は負わない。'},
  {id:'c_s9',f:'civ',lv:'std',q:'独占禁止法を運用する機関はどれか。',ch:['公正取引委員会','日本銀行','国税庁','消費者庁'],a:0,ex:'企業の独占や不当な取引制限を監視し、公正な競争を保つ。'},
  {id:'c_s10',f:'civ',lv:'std',q:'景気が悪いときに日本銀行が行う金融政策はどれか。',ch:['国債などを買い、通貨量を増やす','国債を売る','税を上げる','公共事業を減らす'],a:0,ex:'買いオペレーションで市中の通貨量を増やし、金利を下げて投資を促す。'},
  {id:'c_s11',f:'civ',lv:'std',q:'円高が輸出企業に不利とされる理由はどれか。',ch:['海外での価格が上がり売れにくくなるから','原材料が高くなるから','関税が上がるから','人件費が上がるから'],a:0,ex:'1ドル150円から100円になると、同じ1万円の商品が海外では約67ドルから100ドルに値上がりする。'},
  {id:'c_s12',f:'civ',lv:'std',q:'消費税のような間接税の問題点として指摘されるものはどれか。',ch:['所得が低い人ほど負担の割合が重くなる','景気に左右されやすい','徴収が難しい','高所得者に不利'],a:0,ex:'逆進性。誰もが同率で負担するため、所得に対する割合は低所得者ほど高くなる。'},
  {id:'c_s13',f:'civ',lv:'std',q:'クーリング・オフ制度の説明として正しいものはどれか.',ch:['一定期間内なら契約を無条件で解除できる','商品を安く買える','税を減らせる','裁判を早く行える'],a:0,ex:'訪問販売などで消費者が冷静に判断できるよう、一定期間の解約を認める制度。'},
  {id:'c_s14',f:'civ',lv:'std',q:'少子高齢化が社会保障に与える影響として正しいものはどれか。',ch:['支える現役世代が減り一人あたりの負担が増える','給付が減って負担も減る','影響はない','保険料が不要になる'],a:0,ex:'年金や医療の受給者が増える一方、保険料を負担する現役世代が減る。'},
  {id:'c_h1',f:'civ',lv:'hard',q:'衆議院の優越が認められている理由はどれか。',ch:['任期が短く解散もあり民意を反映しやすいから','議員数が多いから','歴史が古いから','権限が強いから'],a:0,ex:'任期4年で解散があるため、参議院より国民の意思を反映しやすいと考えられている。'},
  {id:'c_h2',f:'civ',lv:'hard',q:'法律案について衆議院と参議院の議決が異なった場合の扱いはどれか。',ch:['衆議院で出席議員の3分の2以上の再可決で成立','自動的に成立','廃案になる','国民投票を行う'],a:0,ex:'両院協議会を開いても一致しない場合、衆議院の3分の2以上の再可決で成立する。'},
  {id:'c_h3',f:'civ',lv:'hard',q:'内閣不信任決議が可決された場合、内閣がとるべき対応はどれか。',ch:['10日以内に衆議院を解散するか総辞職する','ただちに総辞職のみ','無視できる','参議院を解散する'],a:0,ex:'議院内閣制のしくみ。内閣は国会の信任にもとづいて成立している。'},
  {id:'c_h4',f:'civ',lv:'hard',q:'ある商品の価格が上がったとき、一般に需要量と供給量はどうなるか。',ch:['需要量は減り供給量は増える','どちらも増える','どちらも減る','需要量は増え供給量は減る'],a:0,ex:'需要曲線は右下がり、供給曲線は右上がり。両者が一致する点が均衡価格。'},
  {id:'c_h5',f:'civ',lv:'hard',q:'1ドル100円から1ドル120円になった。この変化の説明として正しいものはどれか。',ch:['円安が進み輸出に有利になる','円高が進み輸入に有利になる','円高で輸出に有利','変化はない'],a:0,ex:'同じ1ドルを得るのに多くの円が必要＝円の価値が下がった＝円安。輸出に有利、輸入に不利。'},
  {id:'c_h6',f:'civ',lv:'hard',q:'累進課税制度の目的として正しいものはどれか。',ch:['所得の再分配によって格差を縮める','税収を安定させる','徴税を簡単にする','消費を増やす'],a:0,ex:'所得が高いほど税率が上がる。所得税が代表例で、格差の是正をねらう。'},
  {id:'c_h7',f:'civ',lv:'hard',q:'財政政策として、不景気のときに政府が行う対応はどれか。',ch:['公共事業を増やし減税する','公共事業を減らし増税する','金利を上げる','通貨を減らす'],a:0,ex:'需要を生み出して景気を刺激する。金利や通貨量の操作は日本銀行の金融政策。'},
  {id:'c_h8',f:'civ',lv:'hard',q:'国際連合の安全保障理事会で決議が成立しないことがある理由はどれか。',ch:['常任理事国が拒否権を持つから','総会の承認が必要だから','加盟国が多いから','予算がないから'],a:0,ex:'アメリカ・イギリス・フランス・ロシア・中国のうち1か国でも反対すると決議できない。'},
  {id:'c_h9',f:'civ',lv:'hard',q:'地球温暖化対策として2015年に採択された枠組みはどれか。',ch:['パリ協定','京都議定書','ラムサール条約','ワシントン条約'],a:0,ex:'すべての参加国が削減目標を定める。京都議定書は1997年で先進国のみに義務があった。'},
  {id:'c_h10',f:'civ',lv:'hard',q:'SDGsの説明として正しいものはどれか.',ch:['2030年までに達成をめざす持続可能な開発目標','先進国だけの目標','経済成長のみの目標','軍縮のための条約'],a:0,ex:'17の目標からなり、貧困・教育・環境・平等など幅広い課題を扱う。'},
  {id:'c_e16',f:'civ',lv:'easy',q:'日本国憲法において天皇はどのような地位とされているか。',ch:['日本国および日本国民統合の象徴','国の元首で統治権を持つ','内閣の一員','国会の議長'],a:0,ex:'象徴天皇制。国政に関する権能を持たず、内閣の助言と承認により国事行為を行う。'},
  {id:'c_e17',f:'civ',lv:'easy',q:'国民の三大義務に含まれないものはどれか。',ch:['勤労の義務','納税の義務','子どもに教育を受けさせる義務','投票の義務'],a:3,ex:'三大義務は勤労・納税・教育を受けさせること。投票は権利であり義務ではない。'},
  {id:'c_e18',f:'civ',lv:'easy',q:'平等権にもとづく考え方として正しいものはどれか。',ch:['人種や性別で差別されない','好きな職業を選べる','裁判を受けられる','最低限度の生活を営める'],a:0,ex:'法の下の平等。職業選択は自由権、生存権は社会権。'},
  {id:'c_e19',f:'civ',lv:'easy',q:'国会の主な仕事として正しいものはどれか。',ch:['法律をつくる','法律を執行する','裁判を行う','条例をつくる'],a:0,ex:'国会は唯一の立法機関。執行は内閣、裁判は裁判所、条例は地方議会。'},
  {id:'c_e20',f:'civ',lv:'easy',q:'内閣の主な仕事に含まれないものはどれか。',ch:['予算の議決','外交関係の処理','条約の締結','政令の制定'],a:0,ex:'予算を作るのは内閣だが、議決するのは国会。'},
  {id:'c_e21',f:'civ',lv:'easy',q:'地方公共団体の議会が定める決まりを何というか。',ch:['条例','法律','政令','省令'],a:0,ex:'その地域だけに適用される。法律の範囲内で定められる。'},
  {id:'c_e22',f:'civ',lv:'easy',q:'地方自治が「民主主義の学校」と呼ばれる理由はどれか。',ch:['住民が身近な問題で政治に参加できるから','税が安いから','議員が少ないから','歴史が古いから'],a:0,ex:'イギリスのブライスの言葉。身近な問題を通じて民主主義を学べるという意味。'},
  {id:'c_e23',f:'civ',lv:'easy',q:'家計・企業・政府のうち、生産の中心となるのはどれか。',ch:['家計','企業','政府','どれでもない'],a:1,ex:'企業が生産、家計が消費と労働力の提供、政府が公共サービスを担う。'},
  {id:'c_e24',f:'civ',lv:'easy',q:'製造物責任法（PL法）の内容として正しいものはどれか.',ch:['欠陥商品で被害を受けたとき企業に賠償を求められる','商品を安く買える','契約を解除できる','税が軽くなる'],a:0,ex:'企業の過失を証明しなくても、製品の欠陥を示せば賠償を求められる。'},
  {id:'c_e25',f:'civ',lv:'easy',q:'労働三権に含まれないものはどれか。',ch:['団結権','団体交渉権','団体行動権','経営参加権'],a:3,ex:'労働三権は団結権・団体交渉権・団体行動権（争議権）。'},
  {id:'c_e26',f:'civ',lv:'easy',q:'公共料金が国や地方の認可を必要とする理由はどれか。',ch:['国民生活への影響が大きいから','企業が少ないから','税金だから','海外との取引だから'],a:0,ex:'電気・ガス・水道・鉄道など、生活に不可欠で競争が働きにくいため。'},
  {id:'c_e27',f:'civ',lv:'easy',q:'国の歳出のうち最も大きな割合を占めるものはどれか。',ch:['社会保障関係費','防衛関係費','公共事業費','文教費'],a:0,ex:'高齢化により年金・医療・介護の費用が増え続けている。'},
  {id:'c_e28',f:'civ',lv:'easy',q:'国際連合の本部が置かれている都市はどこか。',ch:['ニューヨーク','ジュネーブ','パリ','ロンドン'],a:0,ex:'ニューヨーク。専門機関の多くはジュネーブなどにある。'},
  {id:'g_e25',f:'geo',lv:'easy',q:'季節風（モンスーン）の風向として正しいものはどれか。',ch:['夏は海から陸、冬は陸から海','一年中同じ向き','夏は陸から海','向きは決まっていない'],a:0,ex:'夏は南東から湿った風、冬は北西から乾いた風が吹く。日本の気候の特徴を作る。'},
  {id:'g_e26',f:'geo',lv:'easy',q:'ヒートアイランド現象の説明として正しいものはどれか。',ch:['都市部の気温が周辺より高くなる','海の温度が上がる','山の気温が上がる','気温差がなくなる'],a:0,ex:'アスファルトやビル、排熱が原因。緑地や風の通り道の確保が対策になる。'},
  {id:'g_e27',f:'geo',lv:'easy',q:'日本の領土をめぐる問題で、ロシアが占拠している地域はどれか。',ch:['北方領土','竹島','尖閣諸島','沖ノ鳥島'],a:0,ex:'択捉島・国後島・色丹島・歯舞群島。竹島は韓国が占拠、尖閣諸島は日本が有効支配している。'},
  {id:'g_s16',f:'geo',lv:'std',q:'日本の農業が抱える課題として適切でないものはどれか。',ch:['農業従事者の高齢化','耕作放棄地の増加','後継者の不足','若者の急増'],a:3,ex:'担い手の高齢化と後継者不足が深刻。耕作放棄地も増えている。'},
  {id:'g_s17',f:'geo',lv:'std',q:'日本の水産業で「育てる漁業」にあたるものはどれか。',ch:['養殖業と栽培漁業','遠洋漁業','沖合漁業','沿岸漁業'],a:0,ex:'養殖は出荷まで育て、栽培漁業は稚魚を放流して自然の中で育てる。'},
  {id:'g_s18',f:'geo',lv:'std',q:'再生可能エネルギーに含まれないものはどれか。',ch:['太陽光','風力','地熱','天然ガス'],a:3,ex:'天然ガスは化石燃料。日本は火山国で地熱の潜在力が大きいとされる。'},
  {id:'g_h9',f:'geo',lv:'hard',q:'日本の輸入品の内訳が、かつての原料中心から機械類の比重が高まった理由はどれか。',ch:['海外に移した工場から製品を輸入するようになったから','資源が増えたから','人口が減ったから','関税が上がったから'],a:0,ex:'企業の海外進出により、現地で生産した製品を日本へ輸入する構造に変わった。'},
  {id:'h_e25',f:'his',lv:'easy',q:'弥生時代に大陸から伝わった金属器の組み合わせはどれか。',ch:['青銅器と鉄器','金と銀','ガラスと陶器','石器と土器'],a:0,ex:'青銅器は祭りの道具、鉄器は農具や武器として使われた。'},
  {id:'h_e26',f:'his',lv:'easy',q:'奈良時代に編さんされた、現存する日本最古の歌集はどれか。',ch:['万葉集','古今和歌集','源氏物語','枕草子'],a:0,ex:'天皇から農民まで幅広い層の歌を収める。防人の歌も含まれる。'},
  {id:'h_e27',f:'his',lv:'easy',q:'平安時代に生まれた、日本独自の文化を何というか。',ch:['国風文化','天平文化','元禄文化','化政文化'],a:0,ex:'遣唐使の停止後に発達。かな文字が生まれ、源氏物語や枕草子が書かれた。'},
  {id:'h_e28',f:'his',lv:'easy',q:'安土桃山時代に千利休が大成したものはどれか。',ch:['茶の湯（わび茶）','能','歌舞伎','浮世絵'],a:0,ex:'質素さの中に美を見出すわび茶を確立した。'},
  {id:'h_e29',f:'his',lv:'easy',q:'江戸時代の元禄文化が栄えた地域と担い手の組み合わせはどれか。',ch:['上方の町人','江戸の武士','京都の公家','地方の農民'],a:0,ex:'大阪・京都の町人が担い手。井原西鶴、松尾芭蕉、近松門左衛門が代表。'},
  {id:'h_s19',f:'his',lv:'std',q:'鎌倉新仏教が広まった理由として正しいものはどれか。',ch:['分かりやすく実践しやすかったから','国が強制したから','貴族が広めたから','外国から来たから'],a:0,ex:'念仏や題目を唱えるなど簡明な教えで、武士や庶民に受け入れられた。'},
  {id:'h_s20',f:'his',lv:'std',q:'安土桃山時代の南蛮貿易で日本にもたらされたものはどれか。',ch:['鉄砲やキリスト教','茶','漢字','仏教'],a:0,ex:'ポルトガル人やスペイン人との貿易。鉄砲は戦い方を、キリスト教は文化を変えた。'},
  {id:'h_s21',f:'his',lv:'std',q:'明治時代の文明開化を象徴するものとして適切でないものはどれか.',ch:['太陽暦の採用','洋服やランプの普及','鉄道の開通','刀を差す習慣の奨励'],a:3,ex:'廃刀令により刀を差す習慣は廃止された。'},
  {id:'h_h11',f:'his',lv:'hard',q:'班田収授法が行われなくなった理由として正しいものはどれか。',ch:['人口増加と逃亡で口分田が不足したから','戦争が起きたから','天皇が廃止したから','農業が発達したから'],a:0,ex:'与える田が足りなくなり、墾田永年私財法によって私有地が広がった。'},
  {id:'h_h12',f:'his',lv:'hard',q:'江戸幕府が鎖国を行った主な目的はどれか。',ch:['キリスト教の禁止と貿易の独占','外国と戦うため','人口を増やすため','農業を進めるため'],a:0,ex:'キリスト教の広がりが幕府の支配をおびやかすと考え、貿易の利益も独占した。'},
  {id:'c_s15',f:'civ',lv:'std',q:'間接民主制（議会制民主主義）が採用される理由はどれか。',ch:['全員が直接集まって決めるのは現実的でないから','専門家だけで決めるため','費用がかからないため','憲法で禁止されているため'],a:0,ex:'代表者を選んで決定を委ねる。地方の住民投票などで直接民主制の要素も取り入れられている。'},
  {id:'c_s16',f:'civ',lv:'std',q:'情報公開制度の目的として正しいものはどれか.',ch:['国民が行政を監視し判断できるようにするため','秘密を守るため','税を集めるため','裁判を行うため'],a:0,ex:'知る権利を実質的に保障する。行政の透明性を高める。'},
  {id:'c_s17',f:'civ',lv:'std',q:'ワーク・ライフ・バランスの考え方として正しいものはどれか。',ch:['仕事と生活の両立を図る','仕事を最優先する','働かないことを勧める','賃金を上げる'],a:0,ex:'長時間労働の是正や育児・介護との両立を進める考え方。'},
  {id:'c_s18',f:'civ',lv:'std',q:'企業の社会的責任（CSR）に含まれるものはどれか。',ch:['環境への配慮や地域貢献','利益の最大化のみ','株価を上げること','納税だけ'],a:0,ex:'利益追求だけでなく、環境・人権・地域への責任を果たすことが求められる。'},
  {id:'g_e28',f:'geo',lv:'easy',q:'世界を六つに分けた州のうち、日本が属するものはどれか。',ch:['アジア州','ヨーロッパ州','オセアニア州','アフリカ州'],a:0,ex:'アジア州。さらに東アジア・東南アジア・南アジアなどに分けられる。'},
  {id:'g_e29',f:'geo',lv:'easy',q:'本初子午線が通る国はどこか。',ch:['イギリス','フランス','日本','アメリカ'],a:0,ex:'ロンドンの旧グリニッジ天文台を通る経度0度の線。'},
  {id:'g_e30',f:'geo',lv:'easy',q:'熱帯のうち、雨季と乾季がはっきり分かれる気候はどれか。',ch:['サバナ気候','熱帯雨林気候','ステップ気候','砂漠気候'],a:0,ex:'サバナ気候。まばらな樹木と草原が広がる。'},
  {id:'g_e31',f:'geo',lv:'easy',q:'地中海性気候の特徴として正しいものはどれか。',ch:['夏に乾燥し冬に雨が降る','夏に雨が多い','一年中雨が多い','一年中乾燥'],a:0,ex:'夏の乾燥に強いオリーブやぶどうの栽培がさかん。'},
  {id:'g_e32',f:'geo',lv:'easy',q:'北海道が属する気候帯はどれか。',ch:['温帯','冷帯（亜寒帯）','寒帯','熱帯'],a:1,ex:'冷帯。冬の寒さが厳しく、梅雨がほとんどない。'},
  {id:'g_e33',f:'geo',lv:'easy',q:'日本の東西南北の端のうち、最も南にある島はどれか。',ch:['沖ノ鳥島','南鳥島','与那国島','択捉島'],a:0,ex:'最南端が沖ノ鳥島、最東端が南鳥島、最西端が与那国島、最北端が択捉島。'},
  {id:'g_e34',f:'geo',lv:'easy',q:'日本の領海はふつう海岸線から何海里までか。',ch:['12海里','24海里','200海里','なし'],a:0,ex:'領海は12海里、排他的経済水域は200海里まで。'},
  {id:'g_e35',f:'geo',lv:'easy',q:'関東平野を流れ、流域面積が日本最大の川はどれか。',ch:['利根川','信濃川','石狩川','淀川'],a:0,ex:'流域面積は利根川が最大、長さは信濃川が最長。'},
  {id:'g_e36',f:'geo',lv:'easy',q:'日本三大都市圏のうち、人口が最も多いのはどれか。',ch:['東京圏','大阪圏','名古屋圏','札幌圏'],a:0,ex:'東京圏。日本の人口の約3割が集中している。'},

function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw);
    const init={stats:{},best:{}};localStorage.setItem(STORE_KEY,JSON.stringify(init));return init;
  }catch(e){if(!mem)mem={stats:{},best:{}};return mem;}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){mem=state;}}
let state=load();
if(!state.stats)state.stats={};
if(!state.best)state.best={};
if(state.xp==null)state.xp=0;
if(state.maxCombo==null)state.maxCombo=0;
if(!state.ach)state.ach=[];
if(!state.streak)state.streak={day:'',count:0};
if(state.taBest==null)state.taBest=0;
if(!state.stat)state.stat={day:'',dayQ:0,fields:[],peakWeak:0};
function bumpQ(){
  const t=todayStr();
  if(state.stat.day!==t){state.stat.day=t;state.stat.dayQ=0;}
  state.stat.dayQ++;
  const h=new Date().getHours();
  if(h<5)unlock('nightowl'); else if(h<8)unlock('earlybird');
  if(state.stat.dayQ>=50)unlock('marathon');
  save();
}
if(!state.cards)state.cards=[];

function grantCard(){
  const have=new Set(state.cards||[]);
  const hid=CARDS.filter(c=>c.r==='H'&&!have.has(c.id));
  if(hid.length&&Math.random()<0.04){
    const pick=hid[Math.floor(Math.random()*hid.length)];
    state.cards.push(pick.id);save();
    setTimeout(()=>{toast('🔮 隠し図鑑を発見！ '+pick.e+' '+pick.n);pop(20);},1400);
    return;
  }
  const pool=CARDS.filter(c=>c.r!=='H'&&!have.has(c.id));
  if(!pool.length)return;
  const W={N:6,R:3,SR:1};
  let tot=0;pool.forEach(c=>tot+=W[c.r]);
  let x=Math.random()*tot,pick=pool[0];
  for(const c of pool){x-=W[c.r];if(x<=0){pick=c;break;}}
  state.cards.push(pick.id);save();
  setTimeout(()=>{toast('📖 図鑑に追加: '+pick.e+' '+pick.n+(pick.r==='SR'?'（超レア！）':pick.r==='R'?'（レア）':''));pop(pick.r==='SR'?20:10);},1400);
}

const MAXLV=20;
function xpNeed(l){return 40*l+2*l*l;}
function lvlInfo(xp){
  let l=1,acc=0,need=xpNeed(1);
  while(l<MAXLV&&xp>=acc+need){acc+=need;l++;need=xpNeed(l);}
  if(l>=MAXLV)return{level:MAXLV,cur:Math.max(0,xp-acc),need:xpNeed(MAXLV),max:true};
  return{level:l,cur:xp-acc,need};
}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function touchStreak(){
  const t=todayStr();if(state.streak.day===t)return;
  const y=new Date(Date.now()-864e5);
  const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  state.streak.count=(state.streak.day===ys)?state.streak.count+1:1;
  state.streak.day=t;save();
  if(state.streak.count%7===0){toast('🔥 '+state.streak.count+'日連続達成！');grantCard();}
  else if(state.streak.count>=2)toast('🔥 '+state.streak.count+'日連続！');
  checkAch();
}
function addXp(n){
  const before=lvlInfo(state.xp).level;
  state.xp+=n;const after=lvlInfo(state.xp).level;save();
  if(after>before){
    pop(20);setTimeout(()=>toast('🎉 Lv.'+after+'！「'+evoTitle(after).n+'」に到達！'),350);
    if(after%2===0)grantCard();   // 偶数レベルのみ
  }
  checkAch();
}
function unlock(id){
  if(state.ach.includes(id))return;
  state.ach.push(id);save();
  const a=achAll().find(x=>x.id===id);
  setTimeout(()=>toast((isSecret(id)?'🕵️ 隠し実績を発見: ':'🏅 実績解除: ')+(a?a.name:id)),700);

}
function iboCorrect(){let n=0;Q.forEach(q=>{if(q.lv==='ibo'&&state.stats[q.id])n+=state.stats[q.id].c;});return n;}
function fieldCorrect(f){let n=0;Q.forEach(q=>{if(q.f===f&&state.stats[q.id])n+=state.stats[q.id].c;});return n;}
function lvCorrect(lv){let n=0;Q.forEach(q=>{if(q.lv===lv&&state.stats[q.id])n+=state.stats[q.id].c;});return n;}
function totalCorrect(){let n=0;Object.keys(state.stats).forEach(k=>n+=state.stats[k].c);return n;}
function checkCardMilestone(){
  if(!state.cardMile)state.cardMile=0;
  const marks=[25,60,110,170,240,320,410,510,620,740,870,1010,1160,1320,1490,1670,1860,2060,2270,2490];
  let due=0; marks.forEach(m=>{if(totalCorrect()>=m)due++;});
  while(state.cardMile<due){state.cardMile++;grantCard();}
  save();
}
function checkAch(){
  const solved=Object.keys(state.stats).length;
  const lv=lvlInfo(state.xp).level;
  if(state.maxCombo>=5)unlock('combo5');
  if(state.maxCombo>=10)unlock('combo10');
  if(state.maxCombo>=20)unlock('combo20');
  if(solved>=50)unlock('solve50');
  if(solved>=100)unlock('solve100');
  if(solved>=Q.length)unlock('solveall');
  [['geo','geo50'],['his','his50'],['civ','civ50']]
    .forEach(([f,id])=>{if(fieldCorrect(f)>=50)unlock(id);});
  if(lvCorrect('hard')>=50)unlock('hard50');
  if(state.taBest>=15)unlock('ta15');
  if(state.taBest>=20)unlock('ta20');
  if(state.taBest>=30)unlock('ta30');
  [[3,'streak3'],[7,'streak7'],[14,'streak14'],[30,'streak30']]
    .forEach(([n,id])=>{if(state.streak.count>=n)unlock(id);});
  [[5,'lv5'],[10,'lv10'],[20,'lv20']].forEach(([n,id])=>{if(lv>=n)unlock(id);});
  const cn=cardsNormal().filter(c=>state.cards.includes(c.id)).length;
  if(cn>=10)unlock('cards10');
  if(cn>=30)unlock('cards30');
  if(cn>=50)unlock('cards50');
  if(cn>=cardsNormal().length)unlock('cards34');
  if(CARDS.some(c=>c.r==='H'&&state.cards.includes(c.id)))unlock('secret');
  if(!state.stat.fields)state.stat.fields=[];
  if(state.stat.fields.length>=3)unlock('allfield');
  const wk=weak().length;
  if(wk>state.stat.peakWeak)state.stat.peakWeak=wk;
  if(state.stat.peakWeak>=10&&wk===0)unlock('comeback');
}

  const q=pool[Math.floor(Math.random()*pool.length)];

  let idx=q.items.map((_,i)=>i), t=0;

    return `<div class="label">${label}（${cs.filter(c=>have.has(c.id)).length}/${cs.length}）</div>`+
      cs.map(c=>have.has(c.id)
        ?`<div class="zkr got"><span class="zke">${c.e}</span><div class="zkb"><div class="zkn">${c.n} <span class="zktag ${c.r}">${c.r==='SR'?'超レア':c.r==='R'?'レア':'ふつう'}</span></div><div class="zkd">${c.d}</div></div></div>`
        :`<div class="zkr"><span class="zke">🔒</span><div class="zkb"><div class="zkn" style="color:var(--sub)">？？？</div><div class="zkd">レベルアップ・実績・正解数の節目で手に入る</div></div></div>`).join('');
  };
  const hid=CARDS.filter(c=>c.r==='H'&&have.has(c.id));
  const hidSec=hid.length?`<div class="label">🔮 隠し図鑑（${hid.length}）</div>`+
    hid.map(c=>`<div class="zkr got" style="border-color:#5A68D8"><span class="zke">${c.e}</span><div class="zkb"><div class="zkn">${c.n} <span class="zktag H">隠し</span></div><div class="zkd">${c.d}</div></div></div>`).join(''):'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ 戻る</button>
    <div class="qhead"><h2>📖 社会の図鑑</h2><span class="combo" style="color:var(--accent)">${got}/${norm.length} 発見</span></div>
    ${got>=norm.length?'<div class="statcard" style="justify-content:center"><b style="color:var(--accent)">🏆 コンプリート！</b></div>':''}
    <p class="help" style="margin-bottom:10px">歴史や地理、社会のしくみにまつわる豆知識を集める図鑑。レベルアップ（2つごと）・実績解除・正解数の節目・7日連続学習で手に入る。</p>
    ${hidSec}
    ${sec('SR','⭐ 超レア')}
    ${sec('R','🔹 レア')}
    ${sec('N','・ ふつう')}`;
}

let g={list:[],i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'all'};
function startQuiz(field,ta){
  let list;
  if(field==='weak'){list=shuffle(weak());if(!list.length){toast('苦手はまだないよ');return;}list=list.slice(0,10);}
  else{list=pool(field,curLv);
    if(list.length<4){toast('この条件の問題が足りないよ');return;}
    list=shuffle(list).slice(0,ta?40:10);}
  g={list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:!!ta,t:ta?60:0,timer:null,field};
  renderQuiz();
}
function renderQuiz(){
  if(g.i>=g.list.length)return finish();
  clearInterval(g.timer);
  const q=g.list[g.i];g.answered=false;
  const opts=shuffle(q.ch.map((c,k)=>({c,k})));
  screen.innerHTML=`
    <button class="back" onclick="quitQuiz()">‹ もどる</button>
    <div class="qhead"><div class="left"><h2>${g.ta?'⏱ タイムアタック':'📝 クイズ'}</h2>
      ${g.combo>=2?`<span class="combo">🔥 ${g.combo}コンボ</span>`:''}</div>
      ${g.ta?`<span class="timer" id="tm">${g.t}</span>`:`<span class="combo">${g.i+1}/${g.list.length}</span>`}</div>
    <div class="bar-top"><i style="width:${g.i/g.list.length*100}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="tagf">${esc(fieldName(q.f))}</span><span class="taglv ${q.lv}">${LV[q.lv].n}</span></div>
      <div class="qtext">${esc(q.q)}</div>
    </div>
    <div class="choices">${opts.map(o=>`<button class="choice" data-k="${o.k}" onclick="answer(${o.k})">${esc(o.c)}</button>`).join('')}</div>
    <div id="fb"></div>`;
  if(g.ta){g.timer=setInterval(()=>{g.t--;const el=$('tm');
    if(el){el.textContent=g.t;if(g.t<=5)el.classList.add('warn');}
    if(g.t<=0){clearInterval(g.timer);g.answered=true;finish();}},1000);}
}
function answer(k){
  if(g.answered)return;g.answered=true;clearInterval(g.timer);
  const q=g.list[g.i],ok=k===q.a;
  document.querySelectorAll('.choice').forEach(b=>{const kk=+b.dataset.k;
    if(kk===q.a)b.classList.add('correct');else if(kk===k)b.classList.add('wrong');else b.classList.add('dim');b.onclick=null;});
  const st=state.stats[q.id]||{c:0,w:0};
  bumpQ();
  if(ok)setTimeout(checkCardMilestone,50);
  if(!state.stat.fields)state.stat.fields=[];
  if(!state.stat.fields.includes(q.f)){state.stat.fields.push(q.f);}
  if(ok){g.score++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    if(g.combo>state.maxCombo)state.maxCombo=g.combo;
    st.c++;
    addXp(XPLV[q.lv]+(g.combo>=5?10:g.combo>=3?5:0));touchStreak();
    pop(g.combo>=3?14:8);}
  else{g.combo=0;g.miss.push(q);st.w++;}
  state.stats[q.id]=st;save();
  const head=k===-1?'⏰ 時間切れ':(ok?'⭕ 正解':'❌ 不正解');
  $('fb').innerHTML=`<div class="exp"><b>${head}</b>　${esc(q.ex)}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="next()">次へ ›</button>`;
  $('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){g.i++;renderQuiz();}
function quitQuiz(){clearInterval(g.timer);renderHome();}
function finish(){
  clearInterval(g.timer);
  const total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const key=(g.field||'all')+'_'+curLv+(g.ta?'_ta':'');
  const prev=state.best[key]||0;const isBest=g.score>prev;
  if(isBest){state.best[key]=g.score;save();}
  unlock('first');
  if(g.ta&&g.score>state.taBest){state.taBest=g.score;save();}
  if(!g.ta&&total>=10&&g.score===total)unlock('perfect');
  checkAch();
  const msg={S:'完璧！文句なし',A:'すばらしい理解度',B:'いい調子、あと少し',C:'解説を読んで固めよう',D:'まずは易しめから'}[rk];
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>正答率 ${rate}% ／ 最大 ${g.maxCombo} コンボ</p>
      ${isBest?'<p style="color:var(--accent);font-weight:800">🏅 自己ベスト更新！</p>':`<p>この条件のベスト: ${Math.max(prev,g.score)}問</p>`}
    </div>
    ${miss}
    <div class="row2" style="margin-top:8px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startQuiz('${g.field}',${g.ta})">もう一回</button>
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}
renderHome();
setTimeout(()=>checkUpdate(true),1500);
</script>
